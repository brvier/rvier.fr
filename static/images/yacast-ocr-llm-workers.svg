    <line x1="475" y1="190" x2="475" y2="210"/>
    <line x1="510" y1="190" x2="510" y2="210"/>
  </g>
  <text x="475" y="150" text-anchor="middle" font-family="monospace" font-size="30" font-weight="bold" fill="#fabd2f">LLM</text>
  <path d="M380 140 h28 m-10 -10 10 10 -10 10" fill="none" stroke="#a89984" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="272" text-anchor="middle" font-family="monospace" font-size="20" fill="#a89984">on-screen text · llm enrichment</text>
