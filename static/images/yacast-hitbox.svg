<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Hitbox">
  <rect width="600" height="300" rx="12" fill="#282828"/>
  <!-- disco ball -->
  <line x1="170" y1="30" x2="170" y2="55" stroke="#665c54" stroke-width="5"/>
  <circle cx="170" cy="105" r="50" fill="#3c3836" stroke="#d3869b" stroke-width="5"/>
  <g stroke="#d3869b" stroke-width="3" fill="none" opacity="0.7">
    <path d="M120 105 h100"/>
    <path d="M128 80 h84"/>
    <path d="M128 130 h84"/>
    <line x1="170" y1="55" x2="170" y2="155"/>
    <path d="M145 58 q-8 47 0 94"/>
    <path d="M195 58 q8 47 0 94"/>
  </g>
  <!-- sound rays -->
  <g stroke="#fabd2f" stroke-width="5" stroke-linecap="round">
    <line x1="170" y1="175" x2="170" y2="195"/>
    <line x1="120" y1="160" x2="108" y2="178"/>
    <line x1="220" y1="160" x2="232" y2="178"/>
  </g>
  <!-- phone capturing -->
  <rect x="330" y="45" width="120" height="210" rx="18" fill="#3c3836" stroke="#83a598" stroke-width="5"/>
  <rect x="375" y="58" width="30" height="7" rx="3.5" fill="#665c54"/>
  <!-- waveform on screen -->
  <g stroke="#fe8019" stroke-width="6" stroke-linecap="round">
    <line x1="355" y1="140" x2="355" y2="160"/>
    <line x1="372" y1="125" x2="372" y2="175"/>
    <line x1="389" y1="105" x2="389" y2="195"/>
    <line x1="406" y1="130" x2="406" y2="170"/>
    <line x1="423" y1="115" x2="423" y2="185"/>
  </g>
  <circle cx="390" cy="232" r="10" fill="none" stroke="#665c54" stroke-width="4"/>
  <!-- usb plug -->
  <line x1="450" y1="150" x2="500" y2="150" stroke="#a89984" stroke-width="6"/>
  <rect x="500" y="138" width="34" height="24" rx="4" fill="#a89984"/>
  <text x="300" y="285" text-anchor="middle" font-family="monospace" font-size="20" fill="#a89984">usb audio capture · android</text>
</svg>
