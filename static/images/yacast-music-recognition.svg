<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Music Recognition Orchestrator">
  <rect width="600" height="300" rx="12" fill="#282828"/>
  <!-- broadcast waveform -->
  <g stroke="#83a598" stroke-width="6" stroke-linecap="round">
    <line x1="80" y1="130" x2="80" y2="150"/>
    <line x1="100" y1="115" x2="100" y2="165"/>
    <line x1="120" y1="95" x2="120" y2="185"/>
    <line x1="140" y1="120" x2="140" y2="160"/>
    <line x1="160" y1="105" x2="160" y2="175"/>
    <line x1="180" y1="125" x2="180" y2="155"/>
    <line x1="200" y1="110" x2="200" y2="170"/>
  </g>
  <!-- matched segment highlighted -->
  <rect x="110" y="85" width="60" height="110" rx="8" fill="none" stroke="#fe8019" stroke-width="4" stroke-dasharray="10 6"/>
  <path d="M230 140 h35 m-12 -12 12 12 -12 12" fill="none" stroke="#a89984" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- note in identification circle -->
  <circle cx="360" cy="140" r="62" fill="#3c3836" stroke="#fabd2f" stroke-width="6"/>
  <ellipse cx="342" cy="172" rx="15" ry="11" fill="#fabd2f"/>
  <rect x="353" y="105" width="7" height="67" fill="#fabd2f"/>
  <path d="M353 105 q25 5 30 22 l0 -18 q-8 -14 -30 -18 z" fill="#fabd2f"/>
  <!-- check result -->
  <circle cx="490" cy="140" r="34" fill="#3c3836" stroke="#8ec07c" stroke-width="6"/>
  <path d="M474 140 l12 12 22 -24" fill="none" stroke="#8ec07c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="272" text-anchor="middle" font-family="monospace" font-size="20" fill="#a89984">live &amp; backtrack audio identification</text>
</svg>
